# .gitbook.yaml
# Place this file at the root of your Git repository.
# GitBook Git Sync only recognizes the exact filename ".gitbook.yaml".

# Directory containing your docs (relative to the repo root).
root: ./

structure:
  # Landing page of the space.
  readme: README.md
  # Table of contents / navigation.
  summary: SUMMARY.md

# Optional: redirect old URLs to new pages.
# Keys are old paths, values are file paths relative to `root`.
redirects:
  # previous/page: guides/new-page.md
  # old-api: reference/api.md
